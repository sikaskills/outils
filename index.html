<title>Mes outils WhatsApp – Sika Skills</title>
<style>
:root{--bg:#f6f8f5;--card:#fff;--ink:#12261d;--mut:#5d6f65;--line:#dbe3dd;--g:#0f3d2e;--y:#f5b700;--yt:#3a2b00;--bad:#b3261e;--badbg:#fdeceb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0c1713;--card:#14241d;--ink:#eaf2ed;--mut:#9fb3a8;--line:#27392f;--g:#1d5c45;--bad:#ff8a80;--badbg:#3a1f1d}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;max-width:720px;margin-inline:auto}
header{background:var(--g);color:#fff;padding:16px 16px 10px}
header h1{margin:0;font-size:20px;font-weight:700}
header p{margin:4px 0 0;font-size:13px;opacity:.85}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--g);display:flex;gap:6px;overflow-x:auto;padding:0 12px 10px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:0;border-radius:20px;padding:8px 14px;font:500 14px system-ui,sans-serif;background:rgba(255,255,255,.12);color:#fff;cursor:pointer}
nav button[aria-selected=true]{background:var(--y);color:var(--yt);font-weight:700}
main{padding:14px 14px 90px}
h2{font-size:18px;margin:4px 0 4px}
.hint{color:var(--mut);font-size:13px;margin:0 0 12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.card.late{border-color:var(--bad);background:var(--badbg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;flex-direction:column;gap:2px;min-width:0}.f.w{grid-column:1/-1}
label{font-size:12px;color:var(--mut)}
input,select,textarea{width:100%;font:16px system-ui,sans-serif;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--y);outline-offset:1px}
.chk{display:flex;align-items:center;gap:8px;font-size:15px;color:var(--ink);padding:6px 0}
.chk input{width:22px;height:22px;accent-color:var(--g);flex:none}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:10px 16px;font:700 15px system-ui,sans-serif;background:var(--g);color:#fff;cursor:pointer}
.btn.y{background:var(--y);color:var(--yt)}.btn.l{background:transparent;color:var(--bad);padding:6px 4px;font-weight:500;font-size:14px}
.btn.o{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:600}
.sum{background:var(--g);color:#fff;border-radius:12px;padding:12px;margin-bottom:12px;font-size:14px}
.sum b{color:var(--y)}.big{font-size:22px;font-weight:700}
.rest{font-weight:700;font-size:18px}.rest.z{color:var(--bad)}
.empty{text-align:center;color:var(--mut);padding:22px 10px;border:1px dashed var(--line);border-radius:12px;margin-bottom:10px}
textarea{min-height:90px;font-size:15px}
.note{font-size:12px;color:var(--mut)}
.msg{white-space:pre-wrap;margin:6px 0;font-size:15px}
.tag{display:inline-block;background:var(--y);color:var(--yt);border-radius:6px;padding:1px 8px;font-size:13px;font-weight:700;margin-right:6px}
.chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:6px 12px;font:500 13px system-ui,sans-serif;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--g);color:#fff;border-color:var(--g)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;margin-top:6px}
.days label{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:2px 0}
.days input{width:24px;height:24px;accent-color:var(--g)}
.gh{margin:14px 0 6px;font-weight:700;color:var(--g)}
@media (prefers-color-scheme:dark){.gh{color:var(--y)}}
#inst{background:var(--y);color:var(--yt);padding:10px 14px;font-size:14px;display:none;align-items:center;gap:10px;justify-content:space-between}
#inst button{border:0;border-radius:8px;padding:8px 12px;font:700 14px system-ui,sans-serif;background:var(--g);color:#fff;cursor:pointer}
details{margin-bottom:12px}summary{cursor:pointer;font-weight:700;padding:8px 0}
</style>
</head>

<header><h1>Mes outils WhatsApp</h1><p>Sika Skills : à remplir chaque jour, sur ton téléphone. Fonctionne sans connexion une fois installée.</p></header>

<script>
var DATA={"msgs": [{"n": 1, "sec": "A. Les demandes de renseignements (n° 1 à 9)", "q": "Premier contact : « Bonjour », « Dispo ? »", "m": "Bonjour, merci pour ton message. Quel article t'intéresse ? Dis-moi ce que tu cherches : je t'envoie le prix, les tailles disponibles et les conditions de livraison."}, {"n": 2, "sec": "A. Les demandes de renseignements (n° 1 à 9)", "q": "Tu ne peux pas répondre complètement tout de suite", "m": "Bonjour, ton message est bien reçu. Je suis [avec un client / en déplacement] pour le moment. Je te réponds en détail avant [heure]."}, {"n": 3, "sec": "A. Les demandes de renseignements (n° 1 à 9)", "q": "Le client demande le prix", "m": "Bonjour ! [Produit] : [prix] FCFA. Disponible en [tailles / couleurs]. Quelle [taille / couleur] cherches-tu ?"}, {"n": 4, "sec": "A. Les demandes de renseignements (n° 1 à 9)", "q": "Le prix dépend de la demande (couture, pâtisserie, coiffure)", "m": "Bonjour ! [Produit] : à partir de [prix] FCFA. Le prix change selon [taille / quantité / tissu / finitions]. Dis-moi [ce dont tu as besoin] et je te donne le prix exact."}, {"n": 5, "sec": "A. Les demandes de renseignements (n° 1 à 9)", "q": "Produit disponible (stock vérifié)", "m": "Bonne nouvelle : [produit] en [taille / couleur] est disponible. Livraison à [zone] : [frais] FCFA, [délai]. Je te le prépare ?"}, {"n": 6, "sec": "A. Les demandes de renseignements (n° 1 à 9)", "q": "Tu dois vérifier la disponibilité", "m": "Je vérifie la disponibilité de [produit] en [taille / couleur] et je te réponds dans [délai que tu peux tenir]."}, {"n": 7, "sec": "A. Les demandes de renseignements (n° 1 à 9)", "q": "Produit épuisé", "m": "Merci d'avoir demandé. [Produit] en [taille / couleur] n'est plus disponible. J'ai [alternative] à [prix] FCFA. Je t'envoie la photo ?\nVariante (seulement si tu le feras vraiment) : « Si tu veux, je te préviens dès qu'il revient. »"}, {"n": 8, "sec": "A. Les demandes de renseignements (n° 1 à 9)", "q": "Le client demande la livraison", "m": "Livraison à [quartier / ville] : [frais] FCFA, [délai]. Pour [autre zone] : [frais], [délai]. Dans quel quartier dois-je livrer ?"}, {"n": 9, "sec": "A. Les demandes de renseignements (n° 1 à 9)", "q": "Le client demande comment payer", "m": "Tu peux payer par [Mobile Money au numéro … / à la livraison / en boutique]. [Précise si un acompte est demandé.] Quel moyen te convient ?"}, {"n": 10, "sec": "B. Les objections (n° 10 à 15)", "q": "Réduction demandée : tu tiens ton prix et tu offres un geste (seulement si tu peux le tenir)", "m": "Merci de ta proposition. Je ne peux pas descendre en dessous de [prix] FCFA pour ce modèle. Par contre, [si tu prends 2 articles / si tu confirmes aujourd'hui], [la livraison est offerte]. Ça te convient ?"}, {"n": 11, "sec": "B. Les objections (n° 10 à 15)", "q": "Réduction demandée : tu acceptes une petite baisse, au-dessus de ton prix plancher", "m": "Pour [produit], je peux faire [nouveau prix] FCFA si tu confirmes [aujourd'hui / avec paiement avant …]. Après cela, le prix redevient [prix normal]. Tu confirmes ?"}, {"n": 12, "sec": "B. Les objections (n° 10 à 15)", "q": "« C'est cher » ou « J'ai vu moins cher ailleurs »", "m": "Je comprends. Ce modèle est à [prix] FCFA parce que [raison réelle : matière, finition, échange possible…]. Si ton budget est de [montant], je peux te proposer [autre modèle] à [prix]. Tu veux le voir ?"}, {"n": 13, "sec": "B. Les objections (n° 10 à 15)", "q": "« Je vais réfléchir »", "m": "Pas de souci, prends ton temps. Je te laisse le prix et les détails ci-dessus. Si tu as une question, ou si tu veux que je garde ta [taille] [jusqu'à …], dis-le-moi."}, {"n": 14, "sec": "B. Les objections (n° 10 à 15)", "q": "Le client hésite entre deux produits", "m": "Les deux sont de bons choix. Le [A] est plus [caractéristique] ([prix]) ; le [B] est plus [caractéristique] ([prix]). Tu les veux plutôt pour [occasion] ou pour tous les jours ? Dis-moi et je te dis lequel je te conseille."}, {"n": 15, "sec": "B. Les objections (n° 10 à 15)", "q": "Le client a peur de se faire tromper", "m": "Tu as raison de poser la question. Voici des photos et une courte vidéo de l'article réel [et des avis de clients, avec leur accord]. Tu peux aussi payer [à la livraison / après avoir vu l'article]. Que veux-tu vérifier d'autre ?\nPropose le paiement à la livraison seulement si tu l'acceptes."}, {"n": 16, "sec": "C. Les intentions d'achat (n° 16 à 19)", "q": "« Je prends » : il te manque des informations", "m": "Super, merci ! Pour préparer ta commande, j'ai besoin de : [taille / couleur], [quantité], ton quartier de livraison et un numéro pour le livreur. Envoie-moi ça et je te fais le récapitulatif."}, {"n": 17, "sec": "C. Les intentions d'achat (n° 16 à 19)", "q": "Le client veut que tu gardes l'article sans payer tout de suite", "m": "Je peux te garder [produit, taille] jusqu'à [jour, heure]. Pour la réservation, [acompte de … FCFA / confirmation par message]. Passé ce délai, l'article redevient disponible pour d'autres clients. Je te le réserve ?"}, {"n": 18, "sec": "C. Les intentions d'achat (n° 16 à 19)", "q": "Le client veut plusieurs articles", "m": "Voici le total : [article 1] [prix] + [article 2] [prix] = [total] FCFA, plus livraison [frais]. Total à payer : [montant] FCFA. Je prépare cette commande ?"}, {"n": 19, "sec": "C. Les intentions d'achat (n° 16 à 19)", "q": "Il manque une seule information", "m": "Il me manque une seule information pour avancer : [la pointure / la couleur / ton quartier]. Tu me l'envoies ?"}, {"n": 20, "sec": "D. Les commandes (n° 20 à 25)", "q": "Récapitulatif avant le paiement", "m": "Voici le récapitulatif de ta commande :\nProduit : [produit]\nTaille / couleur : [taille / couleur]\nQuantité : [quantité]\nPrix : [prix] FCFA\nLivraison : [lieu], [frais] FCFA, [date et heure prévues]\nTotal à payer : [montant] FCFA\nPaiement : [moyen]\nTout est correct ? Réponds « Oui » pour confirmer."}, {"n": 21, "sec": "D. Les commandes (n° 20 à 25)", "q": "Demande de paiement", "m": "Pour confirmer ta commande, envoie [montant] FCFA par [Mobile Money] au [numéro] (nom : [nom]). Envoie-moi ensuite la référence de la transaction : je vérifie sur mon téléphone, et je prépare ta commande dès que le paiement est arrivé."}, {"n": 22, "sec": "D. Les commandes (n° 20 à 25)", "q": "Paiement reçu (après vérification)", "m": "Paiement bien reçu, merci ! Ta commande est confirmée : [produit], livraison prévue [jour, heure]. Je te préviens quand elle part."}, {"n": 23, "sec": "D. Les commandes (n° 20 à 25)", "q": "Article indisponible après la commande", "m": "Je dois te prévenir : après vérification, [produit en taille / couleur] n'est finalement plus disponible, je suis désolé(e). Je peux te proposer [alternative] ou [te rembourser entièrement aujourd'hui si tu as déjà payé]. Que préfères-tu ?"}, {"n": 24, "sec": "D. Les commandes (n° 20 à 25)", "q": "Livraison en route", "m": "Ta commande est en route. Le livreur arrive vers [heure]. Peux-tu garder ton téléphone allumé ? [Prépare [montant] FCFA si tu paies à la livraison.]"}, {"n": 25, "sec": "D. Les commandes (n° 20 à 25)", "q": "Après la livraison", "m": "Bonjour [prénom], ta commande est-elle bien arrivée ? Est-ce que [produit] te convient ? Si quelque chose ne va pas, dis-le-moi : je veux que tu sois satisfait(e). Merci pour ta confiance."}, {"n": 26, "sec": "E. Les relances (n° 26 à 30)", "q": "Le client a demandé le prix, puis n'a plus répondu", "m": "Bonjour [prénom], je reviens vers toi au sujet de [produit] à [prix] FCFA. [Il reste la taille ….] Souhaites-tu que je te le prépare, ou as-tu une question ?"}, {"n": 27, "sec": "E. Les relances (n° 26 à 30)", "q": "Tu avais vérifié une taille ou une disponibilité pour lui", "m": "Bonjour ! Tu m'avais demandé [taille] pour [produit] : elle est disponible. Je peux te la garder jusqu'à [heure]. Tu la veux ?"}, {"n": 28, "sec": "E. Les relances (n° 26 à 30)", "q": "Il hésitait entre deux produits", "m": "Bonjour [prénom], tu hésitais entre [A] et [B]. Si cela peut t'aider, voici [une photo en situation / une information utile] sur [A]. Dis-moi si tu veux que je t'en prépare un."}, {"n": 29, "sec": "E. Les relances (n° 26 à 30)", "q": "Commande confirmée, mais paiement non reçu", "m": "Bonjour [prénom], ta commande de [produit] est prête à partir dès que le paiement est arrivé. Veux-tu toujours la recevoir [jour] ? Si tu préfères reporter, dis-le-moi : [je remets l'article en vente à [heure]]."}, {"n": 30, "sec": "E. Les relances (n° 26 à 30)", "q": "Dernier message : tu clos la demande avec respect", "m": "Bonjour [prénom], je ne veux pas t'envoyer trop de messages, alors je clos ta demande pour [produit]. Si tu changes d'avis, écris-moi quand tu veux : je serai ravi(e) de t'aider. Bonne continuation !"}, {"n": "R1", "sec": "F. Relancer sans déranger (R1 à R10)", "q": "Tu as une vraie nouveauté à annoncer (nouvelle couleur, nouvelle taille)", "m": "Bonjour [prénom], [produit] vient d'arriver en [nouvelle couleur / taille]. J'ai pensé à toi car tu cherchais [ce qu'il avait demandé]. Je t'envoie la photo ?"}, {"n": "R2", "sec": "F. Relancer sans déranger (R1 à R10)", "q": "Avant la fin d'une réservation", "m": "Bonjour [prénom], je te garde [produit, taille] jusqu'à [heure]. Après, je le remets à disposition. Tu confirmes ?"}, {"n": "R3", "sec": "F. Relancer sans déranger (R1 à R10)", "q": "Le client avait dit « je te réponds ce soir / demain » et n'a rien dit", "m": "Bonjour [prénom], tu m'avais dit que tu me répondrais [hier / ce soir] pour [produit]. As-tu pu décider ? Si tu as encore une question, je suis là."}, {"n": "R4", "sec": "F. Relancer sans déranger (R1 à R10)", "q": "Le client avait donné une date (budget, fin du mois)", "m": "Bonjour [prénom], tu m'avais dit que tu reviendrais vers moi [début du mois]. [Produit] est toujours disponible en [taille]. On avance ?"}, {"n": "R5", "sec": "F. Relancer sans déranger (R1 à R10)", "q": "Un produit demandé est de retour en stock (tu le lui avais promis)", "m": "Bonjour [prénom], tu m'avais demandé [produit en taille]. Il est de retour ! Je te le garde jusqu'à [heure] ?"}, {"n": "R6", "sec": "F. Relancer sans déranger (R1 à R10)", "q": "Un devis ou une commande sur mesure sans réponse", "m": "Bonjour [prénom], je reviens vers toi au sujet de [devis]. Pour réserver ta date, j'ai besoin de ta confirmation avant [date]. Une question sur le devis ?"}, {"n": "R7", "sec": "F. Relancer sans déranger (R1 à R10)", "q": "Produit lié à un événement (fête, mariage, anniversaire)", "m": "Bonjour [prénom], pour ton [événement] du [date], je prends les commandes jusqu'au [date limite]. Souhaites-tu que je réserve ta commande de [produit] ?"}, {"n": "R8", "sec": "F. Relancer sans déranger (R1 à R10)", "q": "Paiement non reçu (deuxième message, sans accusation)", "m": "Bonjour [prénom], je n'ai pas encore reçu le paiement de ta commande de [produit]. Y a-t-il un souci que je peux t'aider à résoudre ? Je peux te renvoyer les informations de paiement."}, {"n": "R9", "sec": "F. Relancer sans déranger (R1 à R10)", "q": "Après livraison, client satisfait, un produit complémentaire (une seule fois)", "m": "Bonjour [prénom], je suis content(e) que [produit] te plaise. Si tu cherches aussi [produit complémentaire], j'en ai en [détail]. Je t'envoie la photo ?"}, {"n": "R10", "sec": "F. Relancer sans déranger (R1 à R10)", "q": "Ancien client, sans nouvelles depuis longtemps (seulement s'il t'a déjà écrit ou acheté)", "m": "Bonjour [prénom], j'espère que tu vas bien. J'ai de nouveaux [articles] depuis ta dernière commande. Veux-tu que je t'envoie les photos ?\nMessage personnel, envoyé à une personne qui t'a déjà écrit, pas à toute ta liste en même temps."}, {"n": "Accueil", "sec": "G. Messages automatiques (accueil, absence)", "q": "Pour ton message d'accueil automatique", "m": "Bonjour et merci de ton message ! Je suis [prénom], de [boutique]. Dis-moi quel produit t'intéresse (et ta [taille / couleur]), je te réponds dès ite et ce dont tu as besoin pour commander.", "ex": "Je prends les commandes jusqu'à [jour, heure]. Envoie-moi le produit, la taille et ta zone de livraison. Fais ensuite le bilan de ta semaine (outil 10)."}, {"j": 8, "type": "1. Présenter un produit", "obj": "Faire connaître un deuxième article.", "pres": "Nom, prix, tailles ou variantes, comment commander.", "ex": "[Nouveau produit] à [prix] FCFA, en [tailles / variantes]. Écris-moi pour commander."}, {"j": 9, "type": "3. Question fréquente", "obj": "Lever un doute avant la commande.", "pres": "Taille, paiement, retour ou échange selon ce qu'on te demande.", "ex": "Question reçue : « [question] ». Réponse : [réponse]. Un doute ? Écris-moi, je réponds."}, {"j": 10, "type": "2. Caractéristique", "obj": "Valoriser ce deuxième produit.", "pres": "Une seule qualité, avec une photo qui la montre.", "ex": "[Produit] : [caractéristique]. Parfait pour [usage]. Je te l'envoie en photo si tu veux voir plus."}, {"j": 11, "type": "4. Variantes", "obj": "Montrer l'éventail du choix.", "pres": "Les variantes de ton deuxième produit.", "ex": "[Produit] en [A, B et C]. Dis-moi ce que tu préfères, je te confirme si c'est en stock."}, {"j": 12, "type": "5. Disponibilité", "obj": "Informer sur arrivage ou fin de stock.", "pres": "Ce qui est arrivé, ce qui reste, ce qui sera de retour.", "ex": "Retour de [produit] en [variante]. Il m'en reste [quantité]. Écris-moi pour le réserver."}, {"j": 13, "type": "6. Produit complémentaire", "obj": "Proposer un ensemble.", "pres": "Deux produits qui vont ensemble, avec le prix de chacun.", "ex": "[Produit A] + [produit B]. Prix : [A] FCFA et [B] FCFA. Écris-moi si tu veux l'ensemble."}, {"j": 14, "type": "7. Invitation à commander + bilan", "obj": "Conclure le cycle.", "pres": "Date limite, dernières disponibilités, comment commander.", "ex": "Dernier jour pour commander avant [date] : [produits]. Écris-moi ta commande. Puis fais le bilan de ces 14 jours."}], "rt": {"daily": [{"h": "Le matin", "
